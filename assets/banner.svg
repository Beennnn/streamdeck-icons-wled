<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="WLED icons for Stream Deck — 327 icons: 216 lighting effects as looping animations and 111 palette and control icons">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#141a35"/>
      <stop offset="1" stop-color="#1c1030"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset="0.5" stop-color="#a06bff"/>
      <stop offset="1" stop-color="#ff6ac1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- motif: says what the repo is -->
  <g transform="translate(70,100)">
    <rect x="0" y="16" width="190" height="46" rx="23" fill="#0e1430" stroke="#2a3358" stroke-width="2"/>
    <g fill="url(#accent)">
      <circle cx="26" cy="39" r="11" opacity="0.35"/><circle cx="59" cy="39" r="11" opacity="0.6"/>
      <circle cx="92" cy="39" r="11" opacity="0.95" filter="url(#glow)"/>
      <circle cx="125" cy="39" r="11" opacity="0.6"/><circle cx="158" cy="39" r="11" opacity="0.35"/>
    </g>
    <g><rect x="0" y="82" width="190" height="30" rx="6" fill="url(#accent)" opacity="0.75"/></g>
    <g fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.9">
      <path d="M 0 136 q 24 -22 47 0 t 48 0 t 48 0 t 47 0"/>
    </g>
  </g>

  <!-- title block -->
  <g transform="translate(300,0)">
    <text x="0" y="170" font-family="-apple-system, Segoe UI, sans-serif" font-size="82" font-weight="700" fill="#ffffff" letter-spacing="1.5">WLED ICONS</text>
    <rect x="2" y="192" width="557" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="2" y="238" font-family="-apple-system, Segoe UI, sans-serif" font-size="24" fill="#aab4d8">327 icons — 216 effects as looping GIFs, 111 palettes and controls.</text>
    <text x="2" y="276" font-family="Menlo, Consolas, monospace" font-size="17" fill="#7f8bb5">two installable packs  ·  animated GIF  ·  unofficial, fan-made</text>
  </g>

  <!-- family baseline -->
  <rect x="70" y="312" width="1140" height="3" rx="1.5" fill="#222b4d"/>
  <rect x="70" y="312" width="210" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
